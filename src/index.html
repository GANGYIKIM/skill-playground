<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greeting</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: #f5f5f5;
        color: #222;
      }
      form {
        display: flex;
        gap: 8px;
      }
      input,
      button {
        font-size: 1rem;
        padding: 8px 12px;
      }
    </style>
  </head>
  <body>
    <h1 id="greeting">안녕하세요!</h1>
    <form id="name-form">
      <input id="name-input" type="text" placeholder="이름을 입력하세요" autofocus />
      <button type="submit">확인</button>
    </form>
    <script src="main.js"></script>
  </body>
</html>
